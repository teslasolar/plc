<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlcSim3D - Multi-Vendor PLC Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
        }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border: 2px solid #00ff00;
            font-size: 11px;
            z-index: 100;
            min-width: 250px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        #hmi {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(34, 34, 34, 0.95);
            color: #00ff00;
            padding: 15px;
            border: 2px solid #00ff00;
            font-size: 11px;
            z-index: 100;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        #controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 15px;
            border: 2px solid #00ff00;
            font-size: 11px;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        #bridge-status {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0ff;
            padding: 10px;
            border: 2px solid #0ff;
            font-size: 10px;
            z-index: 100;
            min-width: 200px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        button {
            background: #003300;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 5px 10px;
            margin: 2px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 10px;
        }
        button:hover {
            background: #005500;
        }
        .plc-row {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid;
        }
        .vendor-AB { border-color: #0066cc; }
        .vendor-Siemens { border-color: #009999; }
        .vendor-Mitsu { border-color: #cc0000; }
        .state-EXECUTE { color: #00ff00; }
        .state-STOPPED { color: #ff0000; }
        .state-IDLE { color: #ffff00; }
        .io-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px;
            margin: 3px 0;
        }
        .io-bit {
            background: #111;
            padding: 2px;
            text-align: center;
            border: 1px solid #333;
        }
        .io-bit.on {
            background: #00ff00;
            color: #000;
            font-weight: bold;
        }
        h3 {
            color: #00ffff;
            margin: 10px 0 5px 0;
            font-size: 12px;
        }
        .protocol-badge {
            display: inline-block;
            background: #003366;
            color: #00ccff;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 3px;
            font-size: 9px;
        }
        .bridge-active {
            color: #0f0;
            font-weight: bold;
        }
        .bridge-inactive {
            color: #666;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>🏭 PlcSim3D</h3>
        <div>ISA-95 Multi-Vendor Simulator</div>
        <div>FPS: <span id="fps">60</span></div>
        <div>Scan Rate: 100ms</div>
        <div class="protocol-badge">MODBUS TCP</div>
        <div class="protocol-badge">EtherNet/IP</div>
        <div class="protocol-badge">HMI BRIDGE</div>
    </div>

    <div id="hmi"></div>

    <div id="controls">
        <h3>⚡ PLC Controls</h3>
        <div id="plc-controls"></div>
    </div>

    <div id="bridge-status">
        <h3>🌉 HMI Bridge</h3>
        <div>Status: <span id="bridge-state" class="bridge-active">ACTIVE</span></div>
        <div>Update Rate: <span id="bridge-rate">100ms</span></div>
        <div>Subscribers: <span id="bridge-subs">0</span></div>
        <div style="margin-top:8px;">
            <button onclick="app.exportBridgeData()">Export Data</button>
            <button onclick="app.testBridge()">Test Bridge</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLC } from './components/plc.js';
        import { HMI } from './components/hmi.js';
        import { Comms } from './components/comms.js';
        import { Render3D } from './components/renderer.js';
        import { VENDORS } from './components/vendors.js';
        import { HMIBridge } from './components/bridge.js';

        // ========================
        // 🚀 MAIN APPLICATION
        // ========================
        class PlcSimApp {
            constructor() {
                this.renderer = new Render3D();
                this.hmi = new HMI('hmi');
                this.comms = new Comms('modbus');
                this.plcs = [];
                this.bridge = null;

                this.init();
            }

            init() {
                console.log('🏭 PlcSim3D Initializing...');

                // Create PLCs for each vendor
                const vendorKeys = ['AB', 'Siemens', 'Mitsu'];
                vendorKeys.forEach((vendorKey, i) => {
                    const plc = new PLC(vendorKey, i + 1);
                    plc.id = `PLC${i + 1}`;
                    plc.init();
                    this.comms.register(plc);

                    // Position PLCs in a row
                    this.renderer.addPLC(plc, [i * 2.5 - 2.5, 0, 0]);
                    this.plcs.push(plc);

                    // Add sample ladder logic
                    plc.addRung(
                        'this.io.DI[0]',
                        function() { this.io.DO[0] = true; }
                    );
                    plc.addRung(
                        'this.io.DI[1]',
                        function() { this.io.DO[1] = true; }
                    );

                    // Start in EXECUTE state
                    plc.setState('EXECUTE');
                });

                // Initialize HMI Bridge
                this.bridge = new HMIBridge(this.plcs);
                this.bridge.start();

                // Subscribe to bridge updates
                this.bridge.subscribe((data) => {
                    // Data is automatically broadcast to subscribers
                    // External HMI systems can subscribe here
                    document.getElementById('bridge-subs').textContent = this.bridge.subscribers.length;
                });

                // Expose bridge globally for external access
                window.plcBridge = this.bridge;

                this.createControls();
                this.startScan();
                this.renderer.animate();

                console.log('✅ PlcSim3D Ready!');
                console.log(`📊 ${this.plcs.length} PLCs initialized`);
                console.log(`📡 Protocol: ${this.comms.proto.toUpperCase()}`);
                console.log(`🌉 HMI Bridge: ACTIVE`);
                console.log('🎮 3D Scene active');
                console.log('💡 Access bridge via: window.plcBridge');
            }

            createControls() {
                const controlsDiv = document.getElementById('plc-controls');
                this.plcs.forEach((plc, idx) => {
                    const div = document.createElement('div');
                    div.style.marginBottom = '10px';
                    div.innerHTML = `<strong>${VENDORS[plc.vendor].name}:</strong><br>`;

                    // State control buttons
                    ['STOPPED', 'IDLE', 'EXECUTE'].forEach(state => {
                        const btn = document.createElement('button');
                        btn.textContent = state;
                        btn.onclick = () => plc.setState(state);
                        div.appendChild(btn);
                    });

                    div.innerHTML += '<br>';

                    // Input toggle buttons
                    for (let i = 0; i < 4; i++) {
                        const btn = document.createElement('button');
                        btn.textContent = `DI${i}`;
                        btn.onclick = () => {
                            plc.io.DI[i] = !plc.io.DI[i];
                        };
                        div.appendChild(btn);
                    }

                    controlsDiv.appendChild(div);
                });
            }

            startScan() {
                // Main scan loop (100ms)
                setInterval(() => {
                    this.plcs.forEach(plc => plc.scan());
                    this.hmi.update(this.plcs, this.comms);
                }, 100);
            }

            exportBridgeData() {
                const data = this.bridge.getData();
                const json = JSON.stringify(data, null, 2);

                // Create download
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `plc-data-${Date.now()}.json`;
                a.click();

                console.log('📦 Bridge data exported:', data);
            }

            testBridge() {
                console.log('🧪 Testing HMI Bridge...');

                // Test all API methods
                console.log('PLC State:', this.bridge.getPlcState(0));
                console.log('IO Data:', this.bridge.getIO(0));
                console.log('Tags:', this.bridge.getTags(0));
                console.log('Full Data:', this.bridge.getData());
                console.log('OPC Export:', this.bridge.exportOPC());
                console.log('Modbus Export:', this.bridge.exportModbus());

                // Test message handler
                const testMsg = {
                    action: 'GET_ALL',
                    plcId: 0
                };
                console.log('Message Test:', this.bridge.handleMessage(testMsg));

                alert('Bridge test complete! Check console for details.');
            }
        }

        // Start application
        const app = new PlcSimApp();
        window.app = app;

        // Expose API for external HMI systems
        window.PlcAPI = {
            // Get all PLCs data
            getAllData: () => app.bridge.getData(),

            // Get specific PLC
            getPlc: (id) => app.bridge.getPlcState(id),

            // Get IO
            getIO: (plcId) => app.bridge.getIO(plcId),

            // Set IO
            setIO: (plcId, type, index, value) => app.bridge.setIO(plcId, type, index, value),

            // Get tag
            getTag: (plcId, tagName) => app.bridge.getTag(plcId, tagName),

            // Set tag
            setTag: (plcId, tagName, value) => app.bridge.setTag(plcId, tagName, value),

            // Subscribe to updates
            subscribe: (callback) => app.bridge.subscribe(callback),

            // Get OPC format
            exportOPC: () => app.bridge.exportOPC(),

            // Get Modbus format
            exportModbus: () => app.bridge.exportModbus()
        };

        console.log('💡 PlcAPI available:');
        console.log('  window.PlcAPI.getAllData()');
        console.log('  window.PlcAPI.getPlc(0)');
        console.log('  window.PlcAPI.getIO(0)');
        console.log('  window.PlcAPI.setIO(0, "DI", 0, true)');
        console.log('  window.PlcAPI.subscribe(data => console.log(data))');
    </script>
</body>
</html>
